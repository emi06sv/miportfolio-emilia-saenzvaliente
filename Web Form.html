<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Emilia Saenz Valiente Portfolio</title>
    <link rel="stylesheet" href="form.css">

</head>

<body>
    <h1>Sé el dueño de tu destino</h1>
    <form method="post">
        <fieldset>
            <legend class="one"> Datos de Contacto</legend>
            <br>
            <label for="nombre"> Nombre </label>
            <br>
            <input type="text" name="nombre" id="nombre" autofocus required placeholder="ej: tu nombre" autocomplete="name">
            <br>
            <label for="email"> Tu correo </label>
            <br>
            <input type="email" name="email" id="email" required placeholder="ej: tu-correo@gmail.com" autocomplete="email">
            <br>
            <label for="telefono"> Tu teléfono </label>
            <br>
            <input type="tel" name="telefono" id="telefono" required placeholder="ej: 1234567890" autocomplete="tel">
            <br>
            <label for="clave"> Tu Clave</label>
            <br>
            <input type="password" name="clave" id="clave" minlength="4" maxlength="32" required
                placeholder="ej: 12345">
            
            <br>
            <label for="edad"> Tu edad </label>
            <br>
            <input type="number" id="edad" name="edad" min="18" max="99" required class="selected">
            <br>
            <label for="usuario"> Nombre de usuario </label>
            <br>
            <input type="text" name="usuario" id="usuario" autofocus required placeholder="ej: nombredeusuario">
            <br>
            <label for="pais"> País </label>
            <br>
            <input type="text" id="pais" name="pais" list="paises" required placeholder="ej: México">
            <datalist id="paises">
                <option value="México">
                <option value="España">
                <option value="Argentina">
                <option value="Colombia">
                <option value="Perú">
            </datalist>
            <br>
            <label> Género </label>
            <br>
            <label><input type="radio" name="genero" value="masculino" required> Masculino</label>
            <label><input type="radio" name="genero" value="femenino" required> Femenino</label>
            <label><input type="radio" name="genero" value="otro" required> Otro</label>
            <br>
            <label for="bibliografia"> Bibliografía </label>
            <br>
            <textarea id="bibliografia" name="bibliografia" rows="4" cols="50" placeholder="ej: Yo soy..."></textarea>
        </fieldset>
        <fieldset>
            <legend class="one">Agendar Turno</legend>
            <br>
            <label for="fecha">Seleccionar fecha</label>
            <br>
            <input type="date" id="fecha" name="fecha" required>
            <br>
            <label for="hora">Seleccionar hora</label>
            <br>
            <input type="time" id="hora" name="hora" required class="selected">
            <br>
            <label for="asunto">Tipo de profesional</label>
            <br>
            <select id="asunto" name="asunto" required>
                <option value="" disabled selected>ej: Profesional</option>
                <option value="psicologo">Asesor espiritual</option>
                <option value="nutricionista">Vidente</option>
                <option value="entrenador">Lector de cartas</option>
            </select>
            <br>
            <label for="Nombre del especialista que preferis">Nombre del especialista que preferis</label>
            <br>
            <input type="text" id="Nombre del especialista que preferis" name="Nombre del especialista que preferis" placeholder="ej: María García">
        </fieldset>
        <br>
        <fieldset>
            <legend class="one">Si necesitas atención adicional</legend>
            <br>
            <label for="nombre"> Nombre </label>
            <br>
            <input type="text" name="nombre" id="nombre" autofocus required placeholder="ej: tu nombre" autocomplete="name">
            <br>
            <label for="email"> Tu correo </label>
            <br>
            <input type="email" name="email" id="email" required placeholder="ej: tu-correo@gmail.com" autocomplete="email">
            <br>
            <label for="telefono"> Tu teléfono </label>
            <br>
            <input type="tel" name="telefono" id="telefono" required placeholder="ej: 1234567890" autocomplete="tel">
            <br>
            <label for="comentarios">Comentarios adicionales</label>
            <br>
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="ej: Me gustaría..."></textarea>
            <br>
            <label> Terminos y condiciones </label>
            <br>
            <label>
                <input type="radio" name="Terminos y condiciones" value="acepto" required> Acepto</label>
            <br>
        </fieldset>
        <input type="submit" value="Enviar ahora">
    </form>
</body>

</html>
